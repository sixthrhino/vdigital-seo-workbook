[project]
name = "seo-workbook-common"
version = "0.1.0"
description = "Shared cross-cutting code (config, logging, models, best-practices catalog, validators) for the SEO Workbook MCP server and agent service."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Only the mcp-server actually renders reports / writes Sheets — kept as an
# extra rather than a hard dependency so the agent's image doesn't need
# any of this just to import config/logging.
output = [
    "jinja2>=3.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-cloud-storage>=2.10",
]
# Only the mcp-server persists sessions (MongoDB is the system of record
# for finalized plans) — same reasoning as `output` above.
storage = [
    "pymongo>=4.6",
]
# Only the mcp-server's import_legacy_workbook tool reads a client's legacy
# workbook off Google Sheets — same reasoning as `output`/`storage` above.
legacy_import = [
    "gspread>=6.0",
    "google-auth>=2.30",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_workbook_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit sys.path entry rather than relying solely on `pip install -e`:
# hatchling's editable-install .pth resolution has proven flaky in this
# environment even for a package installing itself (not just the
# cross-package case mcp-server/agent already work around this same way) —
# confirmed non-deterministic across otherwise-identical installs. This
# sidesteps it entirely for tests; unaffected by how the real Docker image
# installs this (a normal non-editable `pip install`, which doesn't use
# .pth files).
pythonpath = ["src"]
