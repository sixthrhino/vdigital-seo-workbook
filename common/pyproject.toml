[project]
name = "seo-workbook-common"
version = "0.1.0"
description = "Shared cross-cutting code (config, logging, models, best-practices catalog, validators) for the SEO Workbook MCP server and agent service."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Only mcp_server actually renders PDFs / writes Sheets — kept as an extra
# rather than a hard dependency so agent_service's image doesn't need
# WeasyPrint's native Pango/Cairo libs just to import config/logging.
output = [
    "jinja2>=3.1",
    "weasyprint>=62",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_workbook_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
