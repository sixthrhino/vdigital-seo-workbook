[project]
name = "seo-testing-agent"
version = "0.1.0"
description = "ADK-based agent running live-site SEO/content QA checks via seo-testing-mcp, migrated from vdigital-testing-agent."
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.3.0",
    # Pinned below 2: mcp 2.0.0 (published 2026-07-28) changed APIs
    # google-adk's McpToolset depends on — see the same pin in
    # seo-workbook-agent's pyproject.toml for the concrete breakage this
    # protects against.
    "mcp>=1.9.0,<2",
    "google-cloud-aiplatform>=1.60.0",
    "google-auth>=2.29.0",
    "google-cloud-storage>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_testing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit sys.path entry rather than relying solely on `pip install -e`:
# hatchling's editable-install .pth resolution has proven non-deterministic
# in this environment (confirmed directly — same install steps, same
# machine, worked once then silently stopped resolving). Sidesteps it
# entirely for tests; unaffected by how the real Docker image installs
# this (a normal non-editable `pip install`, which doesn't use .pth files).
pythonpath = ["src"]
