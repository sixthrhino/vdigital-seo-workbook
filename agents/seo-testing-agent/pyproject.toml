[project]
name = "seo-testing-agent"
version = "0.1.0"
description = "ADK-based agent running live-site SEO/content QA checks via seo-testing-mcp, migrated from vdigital-testing-agent."
requires-python = ">=3.11"
dependencies = [
    # Originally pinned exactly to 2.3.0 (whatever was current when this was
    # first written in the source repo) — moved to 2.5.0 to match
    # seo-workbook-agent/seo-assistant: those two must share one google-adk
    # version (seo-assistant installs all three agent packages together in
    # one process — see its pyproject.toml), and 2.3.0 has a real bug
    # (McpToolset silently drops an *async* header_provider instead of
    # awaiting it, confirmed via a live 500 in seo-assistant) that 2.5.0
    # fixes — this package doesn't use header_provider itself (its
    # McpToolset gets static `headers=` on SseConnectionParams instead) so
    # it was never exposed to that bug, but there's no reason to stay on
    # the older, buggier version once forced to pick one. Full test suite
    # re-verified passing under 2.5.0 before making this change.
    "google-adk==2.5.0",
    # Pinned below 2: mcp 2.0.0 (published 2026-07-28) changed APIs
    # google-adk's McpToolset depends on — see the same pin in
    # seo-workbook-agent's pyproject.toml for the concrete breakage this
    # protects against.
    "mcp>=1.9.0,<2",
    "google-cloud-aiplatform>=1.60.0",
    "google-auth>=2.29.0",
    "google-cloud-storage>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_testing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit sys.path entry rather than relying solely on `pip install -e`:
# hatchling's editable-install .pth resolution has proven non-deterministic
# in this environment (confirmed directly — same install steps, same
# machine, worked once then silently stopped resolving). Sidesteps it
# entirely for tests; unaffected by how the real Docker image installs
# this (a normal non-editable `pip install`, which doesn't use .pth files).
pythonpath = ["src"]
