[project]
name = "seo-workbook-agent"
version = "0.1.0"
description = "ADK-based conversational agent for gathering monthly SEO plans, exposed via a plain HTTP endpoint and a Google Chat webhook."
requires-python = ">=3.11"
# seo-workbook-common isn't listed here since it's not published anywhere —
# resolved via pytest's `pythonpath` setting below rather than an editable
# install (see mcp-servers/seo-workbook-mcp/pyproject.toml for why:
# editable-install .pth resolution was flaky in this environment with
# multiple locally-path packages sharing one venv). The Docker build does
# a normal non-editable `pip install` from a repo-root context instead,
# which isn't affected.
# google-cloud-storage/pymongo/jinja2 are seo-workbook-common's `output`/
# `storage` extras (used by the /reports/{token} redirect route) — listed
# again here directly for the same reason; keep in sync with
# shared/pyproject.toml. jinja2 itself is unused here, but importing
# anything from seo_workbook_common.output runs that package's __init__,
# which imports report_renderer (jinja2) regardless of which submodule is
# actually needed.
dependencies = [
    "google-adk>=1.0",
    # google-adk 2.5.0's McpToolset breaks on mcp 2.0.0 (a real, live PyPI
    # release as of 2026-07-28) — pinned below 2 until google-adk publishes
    # a version that's actually compatible with it.
    "mcp>=1.0,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-auth>=2.30",
    "google-api-python-client>=2.140",
    "google-cloud-storage>=2.10",
    "pymongo>=4.6",
    "jinja2>=3.1",
    # For the page-update dialog's live-page fetch (see page_fetch.py) —
    # pulls the current title/meta description/H1 to show as hint text
    # instead of requiring the specialist to look them up by hand.
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_workbook_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["../../shared/src", "src"]
