# Submitted from the repo root (`gcloud builds submit . --config=agent_service/cloudbuild.yaml ...`)
# so the Dockerfile can COPY the shared common/ package in.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "agent_service/Dockerfile", "-t", "$_IMAGE", "."]
images:
  - "$_IMAGE"
